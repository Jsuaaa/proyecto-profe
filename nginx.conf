# =============================================================================
# Finca · SPA — configuracion de sitio nginx (server en el puerto 80).
# Reemplaza el default.conf de la imagen nginx:alpine.
#   - SPA fallback: rutas de React Router (BrowserRouter) -> /index.html (200).
#   - gzip para texto/JS/CSS/SVG/fuentes.
#   - Cache inmutable y largo para /assets/ (hasheados por Vite) y /fonts/.
#   - index.html sin cache (siempre sirve el shell mas reciente).
# =============================================================================

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # --- Compresion ---
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        font/woff2;

    # --- Assets con hash (cache-busting por nombre): cache 1 año, inmutable ---
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # --- Fuentes auto-alojadas (Poppins .woff2): cache largo ---
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # --- El shell de la SPA no se cachea nunca (para recoger nuevos deploys) ---
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --- SPA fallback: cualquier ruta desconocida -> index.html con HTTP 200.
    #     Los archivos reales (/images/*, /favicon.svg, ...) se sirven tal cual.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
